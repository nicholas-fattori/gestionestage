<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio Stage PCTO</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans">

    <!-- Header / Nav -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-xl text-indigo-900 shadow">
                    <i class="fa-solid font-bold text-2xl fa-school"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Istituto Superiore "Fermi"</h1>
                    <p class="text-xs text-indigo-200">Gestione & Monitoraggio Stage PCTO</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="esportaDati()" class="bg-indigo-800 hover:bg-indigo-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition border border-indigo-600 flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> Esporta DB
                </button>
                <label class="bg-indigo-800 hover:bg-indigo-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition border border-indigo-600 cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-upload"></i> Importa DB
                    <input type="file" id="importFileInput" onchange="importaDati(event)" class="hidden" accept=".json">
                </label>
                <button onclick="ripristinaDefault()" class="bg-red-800/80 hover:bg-red-700 text-white text-xs font-semibold py-2 px-3 rounded-lg transition border border-red-600 flex items-center gap-1.5" title="Ripristina dati iniziali">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Statistiche Rapide -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Totale Studenti</p>
                    <h3 id="statTotale" class="text-2xl font-bold text-slate-800">0</h3>
                </div>
                <div class="bg-indigo-50 text-indigo-600 p-3 rounded-lg"><i class="fa-solid fa-users text-xl"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Stage In Corso</p>
                    <h3 id="statInCorso" class="text-2xl font-bold text-blue-600">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-3 rounded-lg"><i class="fa-solid fa-user-clock text-xl"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Stage Completati</p>
                    <h3 id="statCompletati" class="text-2xl font-bold text-emerald-600">0</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-lg"><i class="fa-solid fa-graduation-cap text-xl"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500 uppercase">Ore Totali Registrate</p>
                    <h3 id="statOre" class="text-2xl font-bold text-amber-600">0</h3>
                </div>
                <div class="bg-amber-50 text-amber-600 p-3 rounded-lg"><i class="fa-solid fa-business-time text-xl"></i></div>
            </div>
        </div>

        <!-- Controlli: Ricerca, Filtri, Nuovo Studente -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto flex-1">
                <!-- Ricerca -->
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="applicaFiltri()" placeholder="Cerca studente, azienda..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <!-- Filtro Classe -->
                <select id="filterClasse" onchange="applicaFiltri()" class="py-2 px-3 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">Tutte le classi</option>
                </select>

                <!-- Filtro Stato -->
                <select id="filterStato" onchange="applicaFiltri()" class="py-2 px-3 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="all">Tutti gli stati</option>
                    <option value="In corso">In corso</option>
                    <option value="Completato">Completato</option>
                    <option value="In attesa">In attesa</option>
                </select>
            </div>

            <!-- Bottone Aggiungi -->
            <button onclick="apriModaleStudente()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-2 px-4 rounded-lg shadow transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> Nuovo Studente
            </button>
        </div>

        <!-- Tabella Studenti -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider">
                            <th class="p-4">Studente</th>
                            <th class="p-4">Classe</th>
                            <th class="p-4">Azienda & Tutor</th>
                            <th class="p-4">Avanzamento Ore</th>
                            <th class="p-4 text-center">Stato</th>
                            <th class="p-4 text-center">Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="studentiTableBody" class="divide-y divide-slate-100 text-sm">
                        <!-- Generato via JS -->
                    </tbody>
                </table>
            </div>
            
            <div id="nessunRisultato" class="hidden p-8 text-center text-slate-500">
                <i class="fa-regular fa-folder-open text-4xl mb-2 text-slate-300"></i>
                <p class="font-medium">Nessuno studente trovato con i filtri selezionati.</p>
            </div>
        </div>

    </main>

    <!-- Modal Modifica/Nuovo Studente -->
    <div id="modalStudente" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-lg w-full overflow-hidden">
            <div class="bg-indigo-900 text-white p-4 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg">Aggiungi Studente</h3>
                <button onclick="chiudiModale()" class="text-indigo-200 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="formStudente" onsubmit="salvaStudente(event)" class="p-6 space-y-4">
                <input type="hidden" id="studenteId">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nome *</label>
                        <input type="text" id="nome" required class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Cognome *</label>
                        <input type="text" id="cognome" required class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Classe *</label>
                        <input type="text" id="classe" required placeholder="es. 4A INFO" class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Stato Stage</label>
                        <select id="stato" class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="In corso">In corso</option>
                            <option value="Completato">Completato</option>
                            <option value="In attesa">In attesa</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Azienda Ospitante *</label>
                    <input type="text" id="azienda" required class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tutor Aziendale</label>
                    <input type="text" id="tutor" class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ore Svolte</label>
                        <input type="number" id="oreSvolte" min="0" required class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Ore Totali Previste</label>
                        <input type="number" id="oreTotali" min="1" required class="w-full p-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div class="pt-4 flex justify-end space-x-3 border-t">
                    <button type="button" onclick="chiudiModale()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Annulla</button>
                    <button type="submit" class="px-4 py-2 text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow">Salva Studente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Collegamento al file JavaScript -->
    <script src="app.js"></script>
</body>
</html>
